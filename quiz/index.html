<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Keuangan | KopdesFITE</title>
  <meta name="description"
    content="Catat pemasukan dan pengeluaran harian, lihat saldo, lalu cari, filter, dan urutkan transaksi.">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="/assets/style.css">
  <!-- Font Awesome dimuat tanpa memblokir render -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </noscript>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
          <i class="fa-solid fa-graduation-cap text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white">KopdesFITE</h1>
          <p class="text-xs text-slate-400">Expense Tracker • Bookmark Manager • Quiz App</p>
        </div>
      </div>
      <nav class="w-full md:w-auto" aria-label="Navigasi utama">
        <ul
          class="flex bg-slate-900/90 p-1 rounded-xl border border-slate-700/70 justify-between md:justify-start gap-1">
          <li>
            <a href="/" aria-current="page"
              class="px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium transition-all duration-200 flex items-center gap-2 bg-indigo-600 text-white shadow-md">
              <i class="fa-solid fa-receipt"></i><span>Catatan Keuangan</span>
            </a>
          </li>
          <li>
            <a href="/bookmark/"
              class="px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium transition-all duration-200 flex items-center gap-2 text-slate-400 hover:text-slate-200">
              <i class="fa-solid fa-bookmark"></i><span>Link Manager</span>
            </a>
          </li>
          <li>
            <a href="/quiz/"
              class="px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium transition-all duration-200 flex items-center gap-2 text-slate-400 hover:text-slate-200">
              <i class="fa-solid fa-circle-question"></i><span>Kuis Interaktif</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
    <section id="tab-content-expense" class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="stat">
          <div class="absolute -right-2 -bottom-2 opacity-10 text-indigo-400 text-6xl"><i
              class="fa-solid fa-scale-balanced"></i></div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Saldo</p>
          <h2 id="total-saldo" class="text-2xl font-extrabold text-indigo-400 mt-1">Rp 0</h2>
        </div>
        <div class="stat">
          <div class="absolute -right-2 -bottom-2 opacity-10 text-emerald-400 text-6xl"><i
              class="fa-solid fa-arrow-trend-up"></i></div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Pemasukan</p>
          <h2 id="total-pemasukan" class="text-2xl font-extrabold text-emerald-400 mt-1">Rp 0</h2>
        </div>
        <div class="stat">
          <div class="absolute -right-2 -bottom-2 opacity-10 text-rose-400 text-6xl"><i
              class="fa-solid fa-arrow-trend-down"></i></div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Pengeluaran</p>
          <h2 id="total-pengeluaran" class="text-2xl font-extrabold text-rose-400 mt-1">Rp 0</h2>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="panel lg:col-span-1 h-fit">
          <h3 class="text-base font-bold text-slate-100 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-plus-circle text-indigo-400"></i> Tambah Transaksi
          </h3>
          <form id="form-expense" novalidate class="space-y-4">
            <div>
              <label for="expense-judul" class="lbl">Judul / Deskripsi *</label>
              <input type="text" id="expense-judul" required placeholder="Contoh: Honor Proyek, Beli Kopi" class="inp">
            </div>
            <div>
              <label for="expense-kategori" class="lbl">Kategori *</label>
              <select id="expense-kategori" class="inp">
                <option value="Makanan & Minuman">Makanan & Minuman</option>
                <option value="Gaji & Project">Gaji & Project</option>
                <option value="Transportasi">Transportasi</option>
                <option value="Hiburan">Hiburan</option>
                <option value="Tagihan & Edukasi">Tagihan & Edukasi</option>
                <option value="Lain-Lain">Lain-Lain</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="expense-jumlah" class="lbl">Jumlah (Rp) *</label>
                <input type="number" id="expense-jumlah" min="1" required placeholder="50000" class="inp">
              </div>
              <div>
                <label for="expense-tipe" class="lbl">Tipe *</label>
                <select id="expense-tipe" class="inp">
                  <option value="Pengeluaran">Pengeluaran</option>
                  <option value="Pemasukan">Pemasukan</option>
                </select>
              </div>
            </div>
            <div>
              <label for="expense-tanggal" class="lbl">Tanggal *</label>
              <input type="date" id="expense-tanggal" required class="inp">
            </div>
            <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Simpan Transaksi</button>
          </form>
        </div>

        <div class="panel lg:col-span-2 space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input type="text" id="expense-search" aria-label="Cari judul transaksi" placeholder="Cari judul..."
              class="flt">
            <select id="expense-filter-tipe" aria-label="Filter tipe" class="flt">
              <option value="SEMUA">Semua Tipe</option>
              <option value="Pemasukan">Pemasukan</option>
              <option value="Pengeluaran">Pengeluaran</option>
            </select>
            <select id="expense-sort" aria-label="Urutkan transaksi" class="flt">
              <option value="terbaru">Terbaru</option>
              <option value="terlama">Terlama</option>
              <option value="terbesar">Jumlah Terbesar</option>
              <option value="terkecil">Jumlah Terkecil</option>
            </select>
          </div>
          <div id="daftar-expense" class="space-y-3 max-h-[420px] overflow-y-auto pr-1"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal-backdrop"
    class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl relative space-y-4"
      role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="flex justify-between items-center pb-3 border-b border-slate-700">
        <h2 id="modal-title" class="text-base font-bold text-slate-100">Modal Title</h2>
        <button id="btn-modal-close" aria-label="Tutup" class="text-slate-400 hover:text-slate-200"><i
            class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="modal-body" class="space-y-4"></div>
    </div>
  </div>

  <footer class="bg-slate-800/80 border-t border-slate-700/80 py-4 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-400">
      <p>&copy; 2026 KopdesFITE • Praktikum Pemrograman Web (PABWE P3)</p>
    </div>
  </footer>

  <script src="/assets/script.js" defer></script>
</body>

</html>
